# Ruimt Neon-databasekopieën van previews op zodra ze niet meer nodig zijn (zie scripts/neon-opruiming.mjs).
# Nodig: repository-geheim NEON_API_KEY (Settings > Secrets and variables > Actions).
name: Neon-opruiming

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: "17 3 * * *" # elke nacht, als vangnet (bv. voor Dependabot, die geen geheimen krijgt)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Proefrun: alleen tonen wat er zou gebeuren"
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: neon-opruiming
  cancel-in-progress: false

jobs:
  opruimen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts/neon-opruiming.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Oude previewkopieën verwijderen
        run: node scripts/neon-opruiming.mjs
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          CLOSED_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || '' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
